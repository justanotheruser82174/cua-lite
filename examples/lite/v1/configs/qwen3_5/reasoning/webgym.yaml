# Qwen3.5 RL training on WebGym
# Multi-step web information retrieval tasks via OmniBoxes HTTP API.
#
# Related configs (sync env_kwargs when changing):
#   - examples/lite/v1/configs/qwen3_5/default/webgym.yaml  (local base-eval counterpart)
#   - scripts/configs/qwen3_5/default/webgym.yaml    (shipped default rollout eval)

agent_id: "qwen3_5"
agent_kwargs:
  resolution: [1280, 720]   # RL agent-side downsample (VRAM)
  enable_inline_reasoning: true
  system_prompt: |
    # Response format

    Response format for every step:
    1) (Optional) Thought: a brief reasoning about what to do next or how to verify the current state.
    2) Action: a short imperative describing what to do in the UI.
    3) A single <tool_call>...</tool_call> block.

    Rules:
    - Output exactly in the order: (optional) Thought, Action, <tool_call>.
    - Include the Thought only when the step needs reasoning; omit it otherwise.
    - Be brief: one sentence for Action.
    - Do not output anything else outside those parts.
    - If a finish action is present in the rendered tool schema, use action=answer for a question-answering task
      or action=terminate for a stop-only task; do not invent unavailable actions.

# max_steps is omitted so webgym uses per-difficulty budgets based on split:
#   train: easy(1-3)→15, medium(4-6)→25, hard(7+)→35
#   eval:  easy(1-3)→30, medium(4-6)→50, hard(7+)→70
# Pass max_steps to override.
env_id: "webgym"
env_kwargs:
  instruction_template: "{instruction}\n\nInitial website: {website}\n\nWhen you have found the answer, submit it to finish the task."
  # WebGym extra_tools: webgym is a Playwright env whose screenshot has
  # NO browser chrome (no address bar / tabs), so cross-page tasks are only
  # solvable with nav tools. Opened so the student's surface matches the gpt
  # teacher recipe (gpt/recipes/collect/webgym.yaml) — the same surface the
  # SFT data is collected under (export_sft replays it from saved metadata).
  extra_tools: ["goto", "back", "response", "terminate"]  # Name selector; env resolves these to metadata.extra_tool_schemas.
