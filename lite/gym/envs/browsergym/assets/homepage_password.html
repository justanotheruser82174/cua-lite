<!DOCTYPE html>
<!--
  WebArena account-credentials page, served at $WA_HOMEPAGE/password.html.

  The homepage hint appended to every WA task goal (browsergym
  GenericWebArenaTask, with_homepage_hint=True) tells the agent:
  "<home>/password.html lists all the account name and password for the
  websites." The upstream webarena-homepage we sparse-checkout from
  web-arena-x/visualwebarena ships app.py's `/password.html` ROUTE but NOT
  this template, so the route 500s (TemplateNotFound) and the credential
  hint dead-ends. install.sh copies this file to templates/password.html
  (alongside the unified index.html.tmpl) so the route resolves.

  Credentials are the canonical WebArena test accounts, verbatim from
  `webarena.browser_env.env_config.ACCOUNTS` (the same dict
  browsergym/webarena/instance.py uses for auto-login). Site URLs are
  intentionally omitted here — the agent reaches each site from the homepage
  index; this page only supplies the login pairs. Wikipedia and Map have no
  login and so are not listed.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Credentials</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        #container {
            width: 90%;
            margin: auto;
            overflow: hidden;
        }
        #header {
            background-color: #f4f7f9;
            color: #232f34;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #b1c1c6 3px solid;
            font-family: 'Roboto', sans-serif;
        }
        #header h1 {
            margin: 0;
            padding-bottom: 30px;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 30px;
        }
        th, td {
            border: 1px solid #b1c1c6;
            padding: 12px 16px;
            text-align: left;
        }
        th {
            background-color: #f4f7f9;
            color: #232f34;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Account Credentials</h1>
    </div>
    <div id="container">
        <table>
            <tr><th>Website</th><th>Username</th><th>Password</th></tr>
            <tr><td>Shopping (OneStopShop)</td><td>emma.lopez@gmail.com</td><td>Password.123</td></tr>
            <tr><td>Shopping Admin (Merchant Admin Portal)</td><td>admin</td><td>admin1234</td></tr>
            <tr><td>Reddit</td><td>MarvelsGrantMan136</td><td>test1234</td></tr>
            <tr><td>Gitlab</td><td>byteblaze</td><td>hello1234</td></tr>
        </table>
    </div>
</body>
</html>
