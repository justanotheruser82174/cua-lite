# EvoCUA rollout eval on ScreenSpot-Pro
# Single-step click grounding: agent sees screenshot + instruction, outputs click.
#
# Reference (sampling): no EvoCUA wrapper in the upstream ScreenSpot-Pro
# repo (${CUA_LITE_REFERENCES_ROOT}/ScreenSpot-Pro-GUI-Grounding/models/).
# We pin greedy decoding (temperature=0.0) here for deterministic eval —
# local.py's sampling defaults may change over time, so pinning the value
# at config-time keeps this rollout stable. EvoCUA's lite.osworld values
# (T=0.01, top_p=0.9, max_new=32768) are OSWorld-specific multi-turn
# settings and not transferable to single-step grounding.
#
# Related configs:
#   - scripts/configs/evocua/default/osworld_g.yaml        (sibling grounding bench)
#   - scripts/configs/evocua/default/lite.osworld.yaml     (multi-turn desktop, EvoCUA-specific sampling)

agent_id: "evocua"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0

env_id: "screenspot_pro"
