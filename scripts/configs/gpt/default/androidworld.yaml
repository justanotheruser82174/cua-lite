# GPT mobile on AndroidWorld
# Multi-step mobile tasks across 20 apps, evaluated by real device state.
#
# Related configs (sync env_kwargs when changing):
#   - scripts/configs/claude/default/androidworld.yaml  (Claude mobile)
#   - scripts/configs/qwen3_vl/default/androidworld.yaml  (Qwen3-VL baseline)
#   - scripts/configs/gpt/default/lite.osworld.yaml  (GPT desktop rollout)

agent_id: "gpt"
agent_kwargs:
  api_kwargs:
    reasoning_effort: "medium"
    max_output_tokens: 4096
  # Mobile API resolution: matches qwen3vl rollout (1080x2400 Pixel 6 native).
  # With ``detail=original`` (default), 2380 patches well under the 10000
  # budget — no provider-side resize expected. ``_call_api_with_actual_dim``
  # GETs the API-echoed processed dims for coord normalization and WARNs
  # if they differ from sent dims (graceful, never raises).

env_id: "androidworld"
env_kwargs:
  # open_app: env extra_tool (make_open_app_tool → app-name enum from the env
  # catalog); not native anymore — surfaced via extra_tools like qwen.
  loop_detect: 0
  extra_tools: ["open_app", "response", "terminate"]
