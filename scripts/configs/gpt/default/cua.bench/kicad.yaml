# gpt rollout eval on cua.bench.local.kicad (a real trycua/cua-xfce container; needs Docker).
# KiCad EDA suite (25 tasks; reproduces GPT-5.5 = 6/25, mean 0.240). Long tasks → max_steps 200.
# Setup: lite/gym/envs/cua/README.md (install.sh downloads datasets → .cache; no export).
# Sibling structure: scripts/configs/gpt/default/lite.osworld.yaml
#
# Run:  uv run python scripts/rollout.py --config-path scripts/configs/gpt/default/cua.bench/kicad.yaml \
#         --env-id cua.bench.local.kicad --splits eval --concurrency 1   # KiCad ONLY: per-task apt-install truncates under concurrent load

agent_id: "gpt"
agent_kwargs:
  api_kwargs:
    reasoning_effort: "medium"
    max_output_tokens: 4096

env_id: "cua.bench.local.kicad"
env_kwargs:
  max_steps: 200
  loop_detect: 0   # 0 = disable loop detection
  extra_tools: []
