# gpt rollout eval on cua.bench.local.workflows (a real trycua/cua-xfce container; needs Docker).
# Real-app workflows (openshot, unity; 52 tasks). Medium-length → max_steps 100.
# Setup: lite/gym/envs/cua/README.md (install.sh downloads datasets → .cache; no export).
# Sibling structure: scripts/configs/gpt/default/lite.osworld.yaml
#
# Run:  uv run python scripts/rollout.py --config-path scripts/configs/gpt/default/cua.bench/workflows.yaml \
#         --env-id cua.bench.local.workflows --splits eval --concurrency 8

agent_id: "gpt"
agent_kwargs:
  api_kwargs:
    reasoning_effort: "medium"
    max_output_tokens: 4096

env_id: "cua.bench.local.workflows"
env_kwargs:
  max_steps: 100
  loop_detect: 0   # 0 = disable loop detection
  extra_tools: []
