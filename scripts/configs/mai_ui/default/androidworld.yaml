# MAI-UI rollout eval on AndroidWorld
# Multi-step mobile tasks across 20 apps, evaluated by real device state.
#
# Sampling kwargs match upstream mai_naivigation_agent.py default runtime_conf
# (greedy, deterministic, seed=42). Reference:
#   ${CUA_LITE_REFERENCES_ROOT}/MAI-UI/src/mai_naivigation_agent.py:228-235
# and the actual API call at line 535-545.
#
# Run:
#   CUDA_VISIBLE_DEVICES=7 uv run python scripts/rollout.py \
#     --model-id Tongyi-MAI/MAI-UI-2B --env-id androidworld \
#     --config-path scripts/configs/mai_ui/default/androidworld.yaml \
#     --head 2

agent_id: "mai_ui"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0
    top_p: 1.0
    top_k: -1

# max_steps omitted: androidworld uses native int(10 * task.complexity) budget.
env_id: "androidworld"
env_kwargs:
  loop_detect: 5
  extra_tools: ["open_app", "response", "terminate"]
