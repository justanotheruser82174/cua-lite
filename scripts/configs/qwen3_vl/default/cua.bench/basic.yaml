# qwen3_vl rollout eval on cua.bench.local.basic (a real trycua/cua-xfce container; needs Docker).
# GUI-action tasks (click-button, fill-form, …; 68 tasks). Short → max_steps 30.
# Setup: lite/gym/envs/cua/README.md (install.sh downloads datasets → .cache; no export).
# Sibling structure: scripts/configs/qwen3_vl/default/lite.osworld.yaml
#
# Run:  uv run python scripts/rollout.py --config-path scripts/configs/qwen3_vl/default/cua.bench/basic.yaml \
#         --env-id cua.bench.local.basic --splits eval --concurrency 8

agent_id: "qwen3_vl"
agent_kwargs:
  sampling_kwargs:   # only honored by rollout.py; RL sets sampling via the trainer
    temperature: 0.0

env_id: "cua.bench.local.basic"
env_kwargs:
  max_steps: 30
  loop_detect: 5   # force terminate after 5 identical consecutive actions
  extra_tools: ["terminate"]
