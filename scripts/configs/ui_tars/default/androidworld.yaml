# UI-TARS-7B-DPO rollout eval on AndroidWorld
# Multi-step mobile tasks; env uses native int(10 * task.complexity) step budget.
#
# Related configs (sync env_kwargs / sampling when changing):
#   - scripts/configs/ui_tars_15_v1/default/androidworld.yaml  (UI-TARS-1.5-7B)
#   - scripts/configs/qwen3_vl/default/androidworld.yaml
#
# Decoding defaults align with the UI-TARS-1.5 HuggingFace endpoint example
# (UI-TARS/README_deploy.md: temperature=0.0, top_p=None, max_tokens=400) so
# ui_tars vs ui_tars_15_v1 runs are comparable on the same benchmark.

agent_id: "ui_tars"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0
    # max_new_tokens=400 matches UI-TARS/README_deploy.md (default would
    # be 2048 from scripts/rollout.py; we cap to stay aligned with
    # the upstream deploy example + ui_tars_15_v1 sibling).
    max_new_tokens: 400

# max_steps omitted: androidworld uses native int(10 * task.complexity) budget.
env_id: "androidworld"
env_kwargs:
  loop_detect: 5
  extra_tools: ["response", "terminate"]
